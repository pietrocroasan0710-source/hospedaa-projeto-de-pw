<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotéis | Hospedaê</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-interna">

  <!-- ========== NAVBAR (navbar = a barra de menu lá de cima, igualzinha à da home nos sites) ========== -->
  <header class="navbar">
    <a href="{{ url_for('home') }}" class="logo">🏨 Hospedaê</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>
    <nav id="menu">
      <a href="{{ url_for('home') }}">Início</a>
      <a href="{{ url_for('hoteis') }}" class="ativo">Hotéis</a>
      <a href="{{ url_for('home') }}#destinos">Destinos</a>
      <a href="{{ url_for('home') }}#como-funciona">Como funciona</a>
      <a href="{{ url_for('reservas') }}">Minhas reservas</a>
      {% if usuario_logado %}<span class="nav-user">Olá, {{ nome_usuario.split()[0] }}</span><form class="nav-logout" action="{{ url_for('sair') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="btn-entrar">Sair</button></form>{% else %}<a href="{{ url_for('login') }}" class="btn-entrar">Entrar</a>{% endif %}
    </nav>
  </header>

  <main class="pagina-hoteis">

    <!-- ========== RESUMO DA BUSCA (o que a pessoa digitou na home volta aqui em "chips", chip = etiquetinha arredondada) ========== -->
    <section class="resumo-busca">
      <h1>Hotéis disponíveis</h1>
      <div class="chips" id="chipsBusca"></div>
      <a href="{{ url_for('home') }}" class="link-alterar">← Alterar busca</a>
    </section>

    <div class="layout">

      <!-- ========== BOTÃO DE FILTROS (só aparece no celular, no PC ele fica escondidinho) ========== -->
      <button type="button" class="btn-filtros-mobile" id="btnFiltros">
        ⚙️ Filtros <span class="badge-filtros" id="badgeFiltros"></span>
      </button>

      <!-- ========== FILTROS (a barra lateral cheia de caixinha pra marcar, tipo loja online) ========== -->
      <aside class="filtros" id="painelFiltros">
        <h2>Filtros</h2>

        <div class="filtro">
          <label for="filtroTexto">Destino ou hotel</label>
          <input type="text" id="filtroTexto" placeholder="Ex.: Gramado">
        </div>

        <div class="filtro">
          <label for="filtroEstado">Estado</label>
          <select id="filtroEstado">
            <option value="">Todos os estados</option>
          </select>
        </div>

        <div class="filtro">
          <label for="filtroPreco">Preço máximo por noite: <strong id="valorPreco"></strong></label>
          <input type="range" id="filtroPreco" step="10">
        </div>

        <div class="filtro">
          <label>Tipo de hospedagem</label>
          <div id="filtroTipos" class="lista-checks"></div>
        </div>

        <div class="filtro">
          <label>Categoria (estrelas)</label>
          <div class="pills">
            <label><input type="radio" name="estrelas" value="0" checked><span>Todas</span></label>
            <label><input type="radio" name="estrelas" value="3"><span>3★+</span></label>
            <label><input type="radio" name="estrelas" value="4"><span>4★+</span></label>
            <label><input type="radio" name="estrelas" value="5"><span>5★</span></label>
          </div>
        </div>

        <div class="filtro">
          <label for="filtroNota">Nota mínima</label>
          <select id="filtroNota">
            <option value="0">Qualquer nota</option>
            <option value="4">⭐ 4,0 ou mais</option>
            <option value="4.5">⭐ 4,5 ou mais</option>
            <option value="4.8">⭐ 4,8 ou mais</option>
          </select>
        </div>

        <div class="filtro">
          <label>Comodidades</label>
          <div id="filtroComodidades" class="lista-checks"></div>
        </div>

        <div class="filtro">
          <label>Preferências</label>
          <div class="interruptores">
            <label class="interruptor"><input type="checkbox" id="fCancel"><span class="trilho"></span>Cancelamento grátis</label>
            <label class="interruptor"><input type="checkbox" id="fPets"><span class="trilho"></span>Aceita pets</label>
            <label class="interruptor"><input type="checkbox" id="fFav"><span class="trilho"></span>Só favoritos ♥</label>
          </div>
        </div>

        <button type="button" id="limparFiltros" class="btn-limpar">Limpar filtros</button>
      </aside>

      <!-- ========== RESULTADOS (aqui fica só uma div vazia, o JS que desenha os cards dentro dela) ========== -->
      <section class="resultados">
        <div class="filtros-ativos" id="filtrosAtivos"></div>

        <div class="barra-resultados">
          <p id="contador">Carregando...</p>
          <div class="ordenar">
            <label for="ordenar">Ordenar por</label>
            <select id="ordenar">
              <option value="relevancia">Relevância</option>
              <option value="preco-asc">Menor preço</option>
              <option value="preco-desc">Maior preço</option>
              <option value="nota">Melhor avaliação</option>
            </select>
          </div>
        </div>

        <div class="grade-hoteis" id="listaHoteis"></div>
      </section>

    </div>
  </main>

  <!-- ========== RODAPÉ (footer = rodapé em inglês, aquela faixa no fim da página que ninguém lê) ========== -->
  <footer>
    <p>© 2026 Hospedaê · Projeto acadêmico de Programação Web</p>
  </footer>

  <!-- ========== SCRIPTS (aqui que o bicho pega! a ordem importa: o jQuery vem primeiro, senão o resto não funciona) ========== -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{{ url_for('static', filename='js/cards.js') }}"></script>
  <script src="{{ url_for('static', filename='js/animacoes.js') }}"></script>
  <script src="{{ url_for('static', filename='js/hoteis.js') }}"></script>
</body>
</html>
